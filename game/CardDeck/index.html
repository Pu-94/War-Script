<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>星尘之下 · 战争脚本 - 卡组管理</title>
  <style>
    :root {
      --bg: #04070f;
      --panel: rgba(10, 16, 33, 0.82);
      --panel-strong: rgba(12, 19, 37, 0.94);
      --text: #f4f3ff;
      --muted: #8fa0c7;
      --gold: #f7c96b;
      --blue: #5ddcff;
      --purple: #b27cff;
      --red: #ff7b5f;
      --green: #63f4b0;
      --border: rgba(255, 255, 255, 0.14);
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(93, 220, 255, 0.18), transparent 28%),
        radial-gradient(circle at 80% 20%, rgba(178, 124, 255, 0.2), transparent 22%),
        linear-gradient(135deg, #03050a 0%, #060d18 55%, #02040b 100%);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .game-container {
      position: relative;
      z-index: 1;
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
      min-height: 100vh;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      border: 1px solid var(--border);
      border-radius: 0px;
      background: rgba(6, 11, 23, 0.7);
      backdrop-filter: blur(18px);
      box-shadow: var(--shadow);
      margin-bottom: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .brand-badge {
      width: 36px;
      height: 36px;
      border-radius: 0%;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--gold), var(--blue));
      color: #071119;
      font-size: 16px;
    }

    .page-title {
      font-size: 18px;
      color: var(--gold);
    }

    .back-btn {
      padding: 8px 16px;
      border-radius: 0px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .admin-btn {
      padding: 8px 16px;
      border-radius: 0px;
      border: 1px solid var(--gold);
      background: rgba(247, 201, 107, 0.15);
      color: var(--gold);
      cursor: pointer;
      transition: all 0.2s;
    }

    .admin-btn:hover {
      background: rgba(247, 201, 107, 0.3);
    }

    .deck-container {
      display: flex;
      gap: 20px;
      height: calc(100vh - 120px);
    }

    .card-pool {
      flex: 1;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 0px;
      padding: 20px;
      overflow-y: auto;
    }

    .card-pool-title {
      font-size: 16px;
      color: var(--muted);
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .selected-deck {
      width: 340px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 0px;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }

    .deck-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .deck-title {
      font-size: 16px;
      color: var(--gold);
    }

    .deck-count {
      font-size: 14px;
      color: var(--muted);
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 12px;
    }

    .selected-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .card {
      position: relative;
      background: linear-gradient(180deg, #1a2238 0%, #0f1525 100%);
      border: 2px solid var(--border);
      border-radius: 0px;
      padding: 12px;
      cursor: pointer;
      transition: all 0.2s;
      user-select: none;
    }

    .card:hover {
      border-color: var(--blue);
      transform: translateY(-2px);
    }

    .card.selected {
      border-color: var(--gold);
      box-shadow: 0 0 20px rgba(247, 201, 107, 0.3);
    }

    .card-type {
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .card-name {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
      color: var(--text);
    }

    .card-cost {
      font-size: 11px;
      color: var(--blue);
      margin-bottom: 6px;
    }

    .card-stats {
      display: flex;
      gap: 12px;
      font-size: 12px;
    }

    .stat {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .stat-atk {
      color: var(--red);
    }

    .stat-hp {
      color: var(--green);
    }

    .selected-card {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 0px;
      padding: 10px 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .selected-card:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .selected-card .card-name {
      flex: 1;
      margin: 0;
      font-size: 13px;
    }

    .selected-card .remove-btn {
      width: 20px;
      height: 20px;
      border-radius: 0px;
      border: none;
      background: rgba(255, 123, 95, 0.2);
      color: var(--red);
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 14px;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: var(--panel-strong);
      border: 1px solid var(--border);
      border-radius: 0px;
      padding: 24px;
      width: 320px;
      box-shadow: var(--shadow);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--gold);
    }

    .modal-close {
      width: 28px;
      height: 28px;
      border-radius: 0px;
      border: none;
      background: rgba(255, 255, 255, 0.1);
      color: var(--muted);
      cursor: pointer;
      font-size: 18px;
    }

    .modal-close:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .property-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .property-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 0px;
    }

    .property-label {
      font-size: 12px;
      color: var(--muted);
      width: 40px;
    }

    .property-value {
      font-size: 14px;
      font-weight: 500;
    }

    .property-value.type {
      color: var(--purple);
    }

    .property-value.faction {
      color: var(--gold);
    }

    .property-value.cost {
      color: var(--blue);
    }

    .property-value.desc {
      color: var(--muted);
      font-size: 12px;
    }

    .property-value.atk {
      color: var(--red);
    }

    .property-value.hp {
      color: var(--green);
    }

    .property-value.keywords {
      color: var(--blue);
    }

    .keywords-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .keyword-tag {
      padding: 2px 8px;
      background: rgba(93, 220, 255, 0.15);
      border-radius: 0px;
      font-size: 11px;
      color: var(--blue);
    }

    .empty-hint {
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      padding: 40px 20px;
    }

    .confirm-btn {
      width: 100%;
      padding: 12px;
      margin-top: 20px;
      border-radius: 0px;
      border: none;
      background: linear-gradient(135deg, var(--gold), #e5a84b);
      color: #071119;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .confirm-btn:hover {
      opacity: 0.9;
    }

    .card-selected-indicator {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 20px;
      height: 20px;
      border-radius: 0%;
      background: var(--gold);
      display: none;
      align-items: center;
      justify-content: center;
      color: #071119;
      font-size: 12px;
    }

    .card.selected .card-selected-indicator {
      display: flex;
    }

    .card-admin-controls {
      display: flex;
      gap: 4px;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }

    .card-edit-btn,
    .card-delete-btn {
      flex: 1;
      padding: 4px 8px;
      font-size: 11px;
      border-radius: 0px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.05);
      color: var(--muted);
      cursor: pointer;
    }

    .card-edit-btn:hover {
      background: rgba(93, 220, 255, 0.2);
      color: var(--blue);
      border-color: var(--blue);
    }

    .card-delete-btn:hover {
      background: rgba(255, 123, 95, 0.2);
      color: var(--red);
      border-color: var(--red);
    }
  </style>
</head>

<body>
  <div class="game-container">
    <div class="topbar">
      <div class="brand">
        <div class="brand-badge">✦</div>
        <span>星尘之下 · 战争脚本</span>
      </div>
      <span class="page-title">卡组管理</span>
      <div style="display: flex; gap: 10px;">
        <button class="admin-btn" id="adminBtn" onclick="showAddCardForm()" style="display: none;">+ 添加卡牌</button>
        <button class="back-btn" onclick="location.href='../Homepage/index.html'">← 返回大厅</button>
      </div>
    </div>

    <div class="deck-container">
      <div class="card-pool">
        <div class="card-pool-title">卡牌库</div>
        <div class="card-grid" id="cardPool"></div>
      </div>

      <div class="selected-deck">
        <div class="deck-header">
          <span class="deck-title">我的卡组</span>
          <span class="deck-count" id="deckCount">0/30</span>
        </div>
        <div class="selected-list" id="selectedList">
          <div class="empty-hint">点击卡牌添加到卡组</div>
        </div>
        <button class="confirm-btn" onclick="saveDeck()">保存卡组</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="propertyModal">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title" id="modalCardName">卡牌名称</span>
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>
      <div class="property-list">
        <div class="property-item">
          <span class="property-label">类型</span>
          <span class="property-value type" id="modalCardType">-</span>
        </div>
        <div class="property-item">
          <span class="property-label">阵营</span>
          <span class="property-value faction" id="modalCardFaction">-</span>
        </div>
        <div class="property-item">
          <span class="property-label">费用</span>
          <span class="property-value cost" id="modalCardCost">-</span>
        </div>
        <div class="property-item">
          <span class="property-label">攻击</span>
          <span class="property-value atk" id="modalCardAtk">-</span>
        </div>
        <div class="property-item">
          <span class="property-label">血量</span>
          <span class="property-value hp" id="modalCardHp">-</span>
        </div>
        <div class="property-item">
          <span class="property-label">词条</span>
          <div class="keywords-list" id="modalCardKeywords"></div>
        </div>
        <div class="property-item">
          <span class="property-label">描述</span>
          <span class="property-value desc" id="modalCardDesc">-</span>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="addCardModal">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">添加新卡牌</span>
        <button class="modal-close" onclick="closeAddCardModal()">×</button>
      </div>
      <div class="property-list">
        <div class="property-item">
          <span class="property-label">名称</span>
          <input type="text" id="newCardName"
            style="background: rgba(255,255,255,0.1); border: 1px solid var(--border); color: var(--text); padding: 6px; border-radius: 0px; width: 150px;"
            placeholder="卡牌名称" />
        </div>
        <div class="property-item">
          <span class="property-label">类型</span>
          <select id="newCardType"
            style="background: rgba(255,255,255,0.1); border: 1px solid var(--border); color: var(--text); padding: 6px; border-radius: 0px;">
            <option value="单位">单位</option>
            <option value="法术">法术</option>
            <option value="装备">装备</option>
          </select>
        </div>
        <div class="property-item">
          <span class="property-label">费用</span>
          <input type="number" id="newCardCost"
            style="background: rgba(255,255,255,0.1); border: 1px solid var(--border); color: var(--text); padding: 6px; border-radius: 0px; width: 80px;"
            value="1" min="0" />
        </div>
        <div class="property-item">
          <span class="property-label">ATK</span>
          <input type="number" id="newCardAttack"
            style="background: rgba(255,255,255,0.1); border: 1px solid var(--border); color: var(--text); padding: 6px; border-radius: 0px; width: 80px;"
            value="1" min="0" />
        </div>
        <div class="property-item">
          <span class="property-label">HP</span>
          <input type="number" id="newCardHealth"
            style="background: rgba(255,255,255,0.1); border: 1px solid var(--border); color: var(--text); padding: 6px; border-radius: 0px; width: 80px;"
            value="1" min="0" />
        </div>
        <div class="property-item">
          <span class="property-label">阵营</span>
          <input type="text" id="newCardFaction"
            style="background: rgba(255,255,255,0.1); border: 1px solid var(--border); color: var(--text); padding: 6px; border-radius: 0px; width: 80px;"
            placeholder="如 ⚙️" />
        </div>
        <div class="property-item">
          <span class="property-label">图标</span>
          <input type="text" id="newCardIcon"
            style="background: rgba(255,255,255,0.1); border: 1px solid var(--border); color: var(--text); padding: 6px; border-radius: 0px; width: 80px;"
            placeholder="如 ⚔️" />
        </div>
        <div class="property-item">
          <span class="property-label">词条</span>
          <input type="text" id="newCardKeywords"
            style="background: rgba(255,255,255,0.1); border: 1px solid var(--border); color: var(--text); padding: 6px; border-radius: 0px; width: 150px;"
            placeholder="用逗号分隔" />
        </div>
        <div class="property-item">
          <span class="property-label">描述</span>
          <input type="text" id="newCardDesc"
            style="background: rgba(255,255,255,0.1); border: 1px solid var(--border); color: var(--text); padding: 6px; border-radius: 0px; width: 180px;"
            placeholder="卡牌描述" />
        </div>
      </div>
      <button class="confirm-btn" onclick="addNewCard()">确认添加</button>
    </div>
  </div>

  <div class="modal-overlay" id="editCardModal">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">编辑卡牌</span>
        <button class="modal-close" onclick="closeEditCardModal()">×</button>
      </div>
      <input type="hidden" id="editCardId" />
      <div class="property-list">
        <div class="property-item">
          <span class="property-label">名称</span>
          <input type="text" id="editCardName"
            style="background: rgba(255,255,255,0.1); border: 1px solid var(--border); color: var(--text); padding: 6px; border-radius: 4px; width: 150px;"
            placeholder="卡牌名称" />
        </div>
        <div class="property-item">
          <span class="property-label">类型</span>
          <select id="editCardType"
            style="background: rgba(255,255,255,0.1); border: 1px solid var(--border); color: var(--text); padding: 6px; border-radius: 4px;">
            <option value="单位">单位</option>
            <option value="法术">法术</option>
            <option value="装备">装备</option>
          </select>
        </div>
        <div class="property-item">
          <span class="property-label">费用</span>
          <input type="number" id="editCardCost"
            style="background: rgba(255,255,255,0.1); border: 1px solid var(--border); color: var(--text); padding: 6px; border-radius: 4px; width: 80px;"
            value="1" min="0" />
        </div>
        <div class="property-item">
          <span class="property-label">ATK</span>
          <input type="number" id="editCardAttack"
            style="background: rgba(255,255,255,0.1); border: 1px solid var(--border); color: var(--text); padding: 6px; border-radius: 4px; width: 80px;"
            value="1" min="0" />
        </div>
        <div class="property-item">
          <span class="property-label">HP</span>
          <input type="number" id="editCardHealth"
            style="background: rgba(255,255,255,0.1); border: 1px solid var(--border); color: var(--text); padding: 6px; border-radius: 4px; width: 80px;"
            value="1" min="0" />
        </div>
        <div class="property-item">
          <span class="property-label">阵营</span>
          <input type="text" id="editCardFaction"
            style="background: rgba(255,255,255,0.1); border: 1px solid var(--border); color: var(--text); padding: 6px; border-radius: 4px; width: 80px;"
            placeholder="如 ⚙️" />
        </div>
        <div class="property-item">
          <span class="property-label">图标</span>
          <input type="text" id="editCardIcon"
            style="background: rgba(255,255,255,0.1); border: 1px solid var(--border); color: var(--text); padding: 6px; border-radius: 4px; width: 80px;"
            placeholder="如 ⚔️" />
        </div>
        <div class="property-item">
          <span class="property-label">词条</span>
          <input type="text" id="editCardKeywords"
            style="background: rgba(255,255,255,0.1); border: 1px solid var(--border); color: var(--text); padding: 6px; border-radius: 4px; width: 150px;"
            placeholder="用逗号分隔" />
        </div>
        <div class="property-item">
          <span class="property-label">描述</span>
          <input type="text" id="editCardDesc"
            style="background: rgba(255,255,255,0.1); border: 1px solid var(--border); color: var(--text); padding: 6px; border-radius: 4px; width: 180px;"
            placeholder="卡牌描述" />
        </div>
      </div>
      <button class="confirm-btn" onclick="updateCard()">保存修改</button>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const supabaseUrl = 'https://dxacqzxcfolvpibqhtaf.supabase.co';
    const supabaseKey = 'sb_publishable_2gGBDA2oWDVsAnOuZMd6Wg_vaM84znQ';
    const supabase = createClient(supabaseUrl, supabaseKey);

    let cardData = [];
    let selectedCards = [];
    let isAdmin = false;

    async function loadCards() {
      const userStr = localStorage.getItem('user');
      const user = userStr ? JSON.parse(userStr) : null;

      if (user) {
        const { data: adminData } = await supabase
          .from('admins')
          .select('username')
          .eq('username', user.username)
          .single();

        isAdmin = !!adminData;
        if (isAdmin) {
          document.getElementById('adminBtn').style.display = 'block';
        }
      }

      const { data, error } = await supabase.from('cards').select('*');
      if (error) {
        console.error('加载卡牌失败:', error);
        document.getElementById('cardPool').innerHTML =
          `<div class="empty-hint">加载卡牌失败: ${error.message}<br>请检查Supabase RLS策略</div>`;
        return;
      }
      if (!data || data.length === 0) {
        document.getElementById('cardPool').innerHTML =
          `<div class="empty-hint">卡牌库为空<br>请在Supabase中添加卡牌数据</div>`;
        return;
      }
      cardData = data;

      if (user) {
        const { data: deckData } = await supabase
          .from('user_deck')
          .select('cards')
          .eq('user_id', user.id)
          .single();

        if (deckData && deckData.cards) {
          const savedCardIds = deckData.cards;
          selectedCards = cardData.filter(c => savedCardIds.includes(c.id));
        }
      }

      renderCardPool();
      renderSelectedList();
    }

    function renderCardPool() {
      const pool = document.getElementById('cardPool');
      pool.innerHTML = cardData.map(card => {
        const adminControls = isAdmin ? `
          <div class="card-admin-controls">
            <button class="card-edit-btn" onclick="event.stopPropagation(); editCard(${card.id})">编辑</button>
            <button class="card-delete-btn" onclick="event.stopPropagation(); deleteCard(${card.id})">删除</button>
          </div>` : '';
        return `
        <div class="card ${selectedCards.some(c => c.id === card.id) ? 'selected' : ''}" 
             data-id="${card.id}"
             onclick="toggleCard(${card.id})"
             ondblclick="showProperties(${card.id})">
          <div class="card-selected-indicator">✓</div>
          <div class="card-type">${card.type}</div>
          <div class="card-name">${card.icon || ''} ${card.name}</div>
          <div class="card-cost">费用: ${card.cost}</div>
          <div class="card-stats">
            <span class="stat stat-atk">⚔ ${card.attack || 0}</span>
            <span class="stat stat-hp">♥ ${card.health || 0}</span>
          </div>
          ${adminControls}
        </div>`;
      }).join('');
    }

    function renderSelectedList() {
      const list = document.getElementById('selectedList');
      const count = document.getElementById('deckCount');

      count.textContent = `${selectedCards.length}/30`;

      if (selectedCards.length === 0) {
        list.innerHTML = '<div class="empty-hint">点击卡牌添加到卡组</div>';
        return;
      }

      list.innerHTML = selectedCards.map(card => `
        <div class="selected-card" 
             data-id="${card.id}"
             onclick="toggleCard(${card.id})"
             ondblclick="showProperties(${card.id})">
          <span class="card-name">${card.icon || ''} ${card.name}</span>
          <button class="remove-btn" onclick="event.stopPropagation(); removeCard(${card.id})">×</button>
        </div>
      `).join('');
    }

    function toggleCard(id) {
      const index = selectedCards.findIndex(c => c.id === id);
      if (index > -1) {
        selectedCards.splice(index, 1);
      } else {
        if (selectedCards.length >= 30) {
          alert('卡组已满（最多30张）');
          return;
        }
        const card = cardData.find(c => c.id === id);
        selectedCards.push(card);
      }
      renderCardPool();
      renderSelectedList();
    }

    function removeCard(id) {
      const index = selectedCards.findIndex(c => c.id === id);
      if (index > -1) {
        selectedCards.splice(index, 1);
        renderCardPool();
        renderSelectedList();
      }
    }

    function showProperties(id) {
      const card = cardData.find(c => c.id === id);
      if (!card) return;

      document.getElementById('modalCardName').textContent = `${card.icon || ''} ${card.name}`;
      document.getElementById('modalCardType').textContent = card.type;
      document.getElementById('modalCardAtk').textContent = card.attack || 0;
      document.getElementById('modalCardHp').textContent = card.health || 0;
      document.getElementById('modalCardDesc').textContent = card.desc || '无';

      const keywordsEl = document.getElementById('modalCardKeywords');
      if (card.keywords && card.keywords.length > 0) {
        keywordsEl.innerHTML = card.keywords.map(k => `<span class="keyword-tag">${k}</span>`).join('');
      } else {
        keywordsEl.innerHTML = '<span class="property-value" style="color: var(--muted)">无</span>';
      }

      document.getElementById('propertyModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('propertyModal').classList.remove('active');
    }

    document.getElementById('propertyModal').addEventListener('click', function (e) {
      if (e.target === this) {
        closeModal();
      }
    });

    document.getElementById('addCardModal').addEventListener('click', function (e) {
      if (e.target === this) {
        closeAddCardModal();
      }
    });

    document.getElementById('editCardModal').addEventListener('click', function (e) {
      if (e.target === this) {
        closeEditCardModal();
      }
    });

    async function saveDeck() {
      const userStr = localStorage.getItem('user');
      if (!userStr) {
        alert('请先登录');
        return;
      }
      const user = JSON.parse(userStr);

      if (selectedCards.length < 1) {
        alert('卡组至少需要1张卡牌');
        return;
      }
      const cardIds = selectedCards.map(c => c.id);
      const { error } = await supabase
        .from('user_deck')
        .upsert({ user_id: user.id, cards: cardIds }, { onConflict: 'user_id' });

      if (error) {
        console.error('保存卡组失败:', error);
        alert('保存失败: ' + error.message);
        return;
      }
      alert('卡组保存成功！');
    }

    function showAddCardForm() {
      document.getElementById('addCardModal').classList.add('active');
    }

    function closeAddCardModal() {
      document.getElementById('addCardModal').classList.remove('active');
    }

    async function addNewCard() {
      if (!isAdmin) {
        alert('只有管理员才能添加卡牌');
        return;
      }

      const name = document.getElementById('newCardName').value.trim();
      const type = document.getElementById('newCardType').value;
      const cost = parseInt(document.getElementById('newCardCost').value) || 0;
      const attack = parseInt(document.getElementById('newCardAttack').value) || 0;
      const health = parseInt(document.getElementById('newCardHealth').value) || 0;
      const faction = document.getElementById('newCardFaction').value.trim();
      const icon = document.getElementById('newCardIcon').value.trim();
      const keywordsStr = document.getElementById('newCardKeywords').value.trim();
      const desc = document.getElementById('newCardDesc').value.trim();

      if (!name) {
        alert('请输入卡牌名称');
        return;
      }

      const keywords = keywordsStr ? keywordsStr.split(',').map(k => k.trim()).filter(k => k) : [];

      const { error } = await supabase.from('cards').insert({
        name,
        type,
        cost,
        attack,
        health,
        faction: faction || null,
        icon: icon || null,
        keywords,
        desc: desc || null
      });

      if (error) {
        console.error('添加卡牌失败:', error);
        alert('添加失败: ' + error.message);
        return;
      }

      alert('卡牌添加成功！');
      closeAddCardModal();
      loadCards();
    }

    function editCard(id) {
      if (!isAdmin) {
        alert('只有管理员才能编辑卡牌');
        return;
      }
      const card = cardData.find(c => c.id === id);
      if (!card) return;

      document.getElementById('editCardId').value = card.id;
      document.getElementById('editCardName').value = card.name || '';
      document.getElementById('editCardType').value = card.type || '单位';
      document.getElementById('editCardCost').value = card.cost || 0;
      document.getElementById('editCardAttack').value = card.attack || 0;
      document.getElementById('editCardHealth').value = card.health || 0;
      document.getElementById('editCardFaction').value = card.faction || '';
      document.getElementById('editCardIcon').value = card.icon || '';
      document.getElementById('editCardKeywords').value = card.keywords ? card.keywords.join(', ') : '';
      document.getElementById('editCardDesc').value = card.desc || '';

      document.getElementById('editCardModal').classList.add('active');
    }

    function closeEditCardModal() {
      document.getElementById('editCardModal').classList.remove('active');
    }

    async function updateCard() {
      if (!isAdmin) {
        alert('只有管理员才能编辑卡牌');
        return;
      }

      const id = parseInt(document.getElementById('editCardId').value);
      const name = document.getElementById('editCardName').value.trim();
      const type = document.getElementById('editCardType').value;
      const cost = parseInt(document.getElementById('editCardCost').value) || 0;
      const attack = parseInt(document.getElementById('editCardAttack').value) || 0;
      const health = parseInt(document.getElementById('editCardHealth').value) || 0;
      const faction = document.getElementById('editCardFaction').value.trim();
      const icon = document.getElementById('editCardIcon').value.trim();
      const keywordsStr = document.getElementById('editCardKeywords').value.trim();
      const desc = document.getElementById('editCardDesc').value.trim();

      if (!name) {
        alert('请输入卡牌名称');
        return;
      }

      const keywords = keywordsStr ? keywordsStr.split(',').map(k => k.trim()).filter(k => k) : [];

      const { error } = await supabase.from('cards').update({
        name,
        type,
        cost,
        attack,
        health,
        faction: faction || null,
        icon: icon || null,
        keywords,
        desc: desc || null
      }).eq('id', id);

      if (error) {
        console.error('更新卡牌失败:', error);
        alert('更新失败: ' + error.message);
        return;
      }

      alert('卡牌更新成功！');
      closeEditCardModal();
      loadCards();
    }

    async function deleteCard(id) {
      if (!isAdmin) {
        alert('只有管理员才能删除卡牌');
        return;
      }

      if (!confirm('确定要删除这张卡牌吗？')) {
        return;
      }

      const { error } = await supabase.from('cards').delete().eq('id', id);

      if (error) {
        console.error('删除卡牌失败:', error);
        alert('删除失败: ' + error.message);
        return;
      }

      alert('卡牌删除成功！');
      loadCards();
    }

    window.toggleCard = toggleCard;
    window.removeCard = removeCard;
    window.showProperties = showProperties;
    window.closeModal = closeModal;
    window.saveDeck = saveDeck;
    window.showAddCardForm = showAddCardForm;
    window.closeAddCardModal = closeAddCardModal;
    window.addNewCard = addNewCard;
    window.editCard = editCard;
    window.deleteCard = deleteCard;
    window.updateCard = updateCard;
    window.closeEditCardModal = closeEditCardModal;
    window.editCard = editCard;
    window.deleteCard = deleteCard;
    window.updateCard = updateCard;
    window.closeEditCardModal = closeEditCardModal;

    loadCards();
  </script>
</body>

</html>
