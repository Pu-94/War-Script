<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>星尘之下 · 战争脚本 - 游戏大厅</title>
    <style>
      :root {
        --bg: #04070f;
        --panel: rgba(10, 16, 33, 0.82);
        --panel-strong: rgba(12, 19, 37, 0.94);
        --text: #f4f3ff;
        --muted: #8fa0c7;
        --gold: #f7c96b;
        --blue: #5ddcff;
        --purple: #b27cff;
        --red: #ff7b5f;
        --green: #63f4b0;
        --border: rgba(255, 255, 255, 0.14);
        --shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(93, 220, 255, 0.18), transparent 28%),
          radial-gradient(circle at 80% 20%, rgba(178, 124, 255, 0.2), transparent 22%),
          linear-gradient(135deg, #03050a 0%, #060d18 55%, #02040b 100%);
        min-height: 100vh;
        overflow-x: hidden;
      }

      canvas {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
      }

      .game-container {
        position: relative;
        z-index: 1;
        max-width: 1400px;
        margin: 0 auto;
        padding: 20px;
        min-height: 100vh;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 20px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: rgba(6, 11, 23, 0.7);
        backdrop-filter: blur(18px);
        box-shadow: var(--shadow);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
        letter-spacing: 0.05em;
      }

      .brand-badge {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--gold), var(--blue));
        color: #071119;
        font-size: 16px;
      }

      .user-info {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .user-avatar {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--purple), var(--blue));
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
      }

      .user-name {
        font-weight: 500;
      }

      .user-level {
        font-size: 0.8rem;
        color: var(--gold);
        background: rgba(247, 201, 107, 0.15);
        padding: 2px 8px;
        border-radius: 8px;
      }

      .nav-tabs {
        display: flex;
        gap: 4px;
        background: rgba(0, 0, 0, 0.3);
        padding: 4px;
        border-radius: 12px;
      }

      .nav-tab {
        padding: 8px 16px;
        border: none;
        border-radius: 8px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font-size: 0.9rem;
        transition: all 0.25s ease;
      }

      .nav-tab:hover {
        color: var(--text);
        background: rgba(255, 255, 255, 0.05);
      }

      .nav-tab.active {
        background: var(--gold);
        color: #031321;
        font-weight: 600;
      }

      .actions {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .btn {
        padding: 8px 16px;
        border: none;
        border-radius: 8px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.25s ease;
        font-size: 0.9rem;
      }

      .btn-primary {
        background: var(--gold);
        color: #031321;
      }

      .btn-primary:hover {
        background: #ffe08f;
        transform: translateY(-1px);
      }

      .btn-ghost {
        background: rgba(255, 255, 255, 0.1);
        color: var(--text);
      }

      .btn-ghost:hover {
        background: rgba(255, 255, 255, 0.15);
      }

      .resource-bar {
        display: flex;
        gap: 20px;
        margin-top: 16px;
        padding: 12px 16px;
        background: rgba(10, 16, 33, 0.6);
        border-radius: 12px;
        border: 1px solid var(--border);
      }

      .resource {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 0.9rem;
      }

      .resource-icon {
        font-size: 1.1rem;
      }

      .resource-value {
        font-weight: 600;
        color: var(--gold);
      }

      .main-content {
        display: grid;
        grid-template-columns: 1fr 320px;
        gap: 20px;
        margin-top: 20px;
      }

      .game-panel {
        background: rgba(10, 16, 33, 0.7);
        border-radius: 16px;
        border: 1px solid var(--border);
        padding: 20px;
        min-height: 500px;
      }

      .panel-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--border);
      }

      .panel-title {
        font-size: 1.1rem;
        font-weight: 600;
      }

      .quick-match-btn {
        padding: 10px 20px;
        background: linear-gradient(135deg, var(--red), #ff9a7b);
        color: white;
        border: none;
        border-radius: 10px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.25s ease;
      }

      .quick-match-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(255, 123, 95, 0.3);
      }

      .battle-arena {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 16px;
      }

      .mode-card {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 20px;
        cursor: pointer;
        transition: all 0.25s ease;
      }

      .mode-card:hover {
        border-color: var(--gold);
        background: rgba(247, 201, 107, 0.05);
        transform: translateY(-2px);
      }

      .mode-icon {
        font-size: 2rem;
        margin-bottom: 10px;
      }

      .mode-name {
        font-weight: 600;
        margin-bottom: 6px;
      }

      .mode-desc {
        font-size: 0.85rem;
        color: var(--muted);
      }

      .mode-status {
        display: inline-block;
        margin-top: 10px;
        padding: 4px 10px;
        border-radius: 6px;
        font-size: 0.75rem;
        background: rgba(99, 244, 176, 0.15);
        color: var(--green);
      }

      .sidebar {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .info-card {
        background: rgba(10, 16, 33, 0.7);
        border-radius: 12px;
        border: 1px solid var(--border);
        padding: 16px;
      }

      .info-title {
        font-weight: 600;
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .deck-preview {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
      }

      .card-thumb {
        aspect-ratio: 3/4;
        background: linear-gradient(135deg, var(--purple), var(--blue));
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.2rem;
        cursor: pointer;
        transition: transform 0.2s ease;
      }

      .card-thumb:hover {
        transform: scale(1.05);
      }

      .rank-info {
        text-align: center;
      }

      .rank-badge {
        width: 80px;
        height: 80px;
        margin: 0 auto 12px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--gold), var(--red));
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        font-weight: 700;
      }

      .rank-name {
        font-weight: 600;
        color: var(--gold);
      }

      .rank-stats {
        font-size: 0.85rem;
        color: var(--muted);
        margin-top: 8px;
      }

      .login-required {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 60vh;
        text-align: center;
      }

      .login-required h2 {
        margin-bottom: 12px;
      }

      .login-required p {
        color: var(--muted);
        margin-bottom: 24px;
      }

      .hidden {
        display: none !important;
      }

      @media (max-width: 900px) {
        .main-content {
          grid-template-columns: 1fr;
        }
        
        .nav-tabs {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="starfield"></canvas>
    
    <div class="game-container">
      <div id="login-required" class="login-required hidden">
        <h2>⚠ 需要登录</h2>
        <p>请先登录后再进入游戏</p>
        <a href="login/index.html" class="btn btn-primary">前往登录</a>
      </div>

      <div id="game-content" class="hidden">
        <header class="topbar">
          <div class="brand">
            <div class="brand-badge">⚔</div>
            <span>星尘之下</span>
          </div>

          <div class="nav-tabs">
            <button class="nav-tab active" data-tab="battle">战斗</button>
            <button class="nav-tab" data-tab="deck">卡组</button>
            <button class="nav-tab" data-tab="collection">收藏</button>
            <button class="nav-tab" data-tab="profile">档案</button>
          </div>

          <div class="user-info">
            <div class="user-avatar" id="user-avatar">?</div>
            <span class="user-name" id="user-name">用户</span>
            <span class="user-level" id="user-level">Lv.1</span>
            <button class="btn btn-ghost" id="logout-btn">登出</button>
          </div>
        </header>

        <div class="resource-bar">
          <div class="resource">
            <span class="resource-icon">💎</span>
            <span>钻石:</span>
            <span class="resource-value" id="diamond-count">0</span>
          </div>
          <div class="resource">
            <span class="resource-icon">🪙</span>
            <span>金币:</span>
            <span class="resource-value" id="gold-count">0</span>
          </div>
          <div class="resource">
            <span class="resource-icon">📜</span>
            <span>材料:</span>
            <span class="resource-value" id="material-count">0</span>
          </div>
        </div>

        <div class="main-content">
          <div class="game-panel" id="main-panel">
            <div class="panel-header">
              <h3 class="panel-title">⚔ 战斗大厅</h3>
              <button class="quick-match-btn" id="quick-match">⚡ 快速匹配</button>
            </div>
            
            <div class="battle-arena" id="battle-modes">
              <div class="mode-card" data-mode="ranked">
                <div class="mode-icon">🏆</div>
                <div class="mode-name">天梯排位</div>
                <div class="mode-desc">与对手一决高下，争夺至高荣耀</div>
                <div class="mode-status">在线匹配中</div>
              </div>
              <div class="mode-card" data-mode="casual">
                <div class="mode-icon">🎮</div>
                <div class="mode-name">休闲对战</div>
                <div class="mode-desc">轻松娱乐，磨炼你的战术技巧</div>
                <div class="mode-status">在线匹配中</div>
              </div>
              <div class="mode-card" data-mode="campaign">
                <div class="mode-icon">📖</div>
                <div class="mode-name">剧情战役</div>
                <div class="mode-desc">体验宏大史诗，感受星际战争的魅力</div>
                <div class="mode-status">章节解锁</div>
              </div>
              <div class="mode-card" data-mode="pve">
                <div class="mode-icon">👹</div>
                <div class="mode-name">挑战首领</div>
                <div class="mode-desc">组队讨伐强大敌人，获取稀有奖励</div>
                <div class="mode-status">推荐挑战</div>
              </div>
            </div>
          </div>

          <aside class="sidebar">
            <div class="info-card">
              <div class="info-title">🎴 当前卡组</div>
              <div class="deck-preview" id="deck-preview">
                <div class="card-thumb">⚔</div>
                <div class="card-thumb">🛡</div>
                <div class="card-thumb">⚡</div>
                <div class="card-thumb">🔥</div>
                <div class="card-thumb">❄</div>
                <div class="card-thumb">🌊</div>
                <div class="card-thumb">🗡</div>
                <div class="card-thumb">🏹</div>
              </div>
            </div>

            <div class="info-card">
              <div class="info-title">📊 排位信息</div>
              <div class="rank-info">
                <div class="rank-badge" id="rank-badge">5</div>
                <div class="rank-name" id="rank-name">青铜段位</div>
                <div class="rank-stats">
                  胜率: <span id="win-rate">0%</span> ·
                  排位赛: <span id="rank-matches">0</span> 场
                </div>
              </div>
            </div>
          </aside>
        </div>
      </div>
    </div>

    <script type="module">
      import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

      const supabaseUrl = 'https://dxacqzxcfolvpibqhtaf.supabase.co';
      const supabaseKey = 'sb_publishable_2gGBDA2oWDVsAnOuZMd6Wg_vaM84znQ';
      const supabase = createClient(supabaseUrl, supabaseKey);

      const AuthModule = {
        currentUser: null,

        async checkAuth() {
          const user = localStorage.getItem('user');
          if (!user) {
            this.showLoginRequired();
            return false;
          }
          
          this.currentUser = JSON.parse(user);
          
          const { data: authData, error } = await supabase.auth.getUser();
          if (error || !authData?.user) {
            this.logout();
            return false;
          }
          
          this.initUserInfo();
          return true;
        },

        showLoginRequired() {
          document.getElementById('login-required').classList.remove('hidden');
          document.getElementById('game-content').classList.add('hidden');
        },

        initUserInfo() {
          const displayName = this.currentUser.username || this.currentUser.email?.split('@')[0] || '指挥官';
          document.getElementById('user-name').textContent = displayName;
          document.getElementById('user-avatar').textContent = displayName.charAt(0).toUpperCase();
          
          this.loadUserData();
        },

        async loadUserData() {
          try {
            const { data, error } = await supabase
              .from('user_data')
              .select('*')
              .eq('user_id', this.currentUser.id)
              .single();
            
            if (data) {
              document.getElementById('diamond-count').textContent = data.diamonds || 0;
              document.getElementById('gold-count').textContent = data.gold || 0;
              document.getElementById('material-count').textContent = data.materials || 0;
              document.getElementById('user-level').textContent = `Lv.${data.level || 1}`;
              document.getElementById('rank-badge').textContent = data.rank || 5;
              document.getElementById('rank-matches').textContent = data.total_matches || 0;
              
              const winRate = data.total_matches > 0 
                ? Math.round((data.wins / data.total_matches) * 100) 
                : 0;
              document.getElementById('win-rate').textContent = `${winRate}%`;
            }
          } catch (e) {
            console.warn('加载用户数据失败:', e.message);
          }
        },

        logout() {
          localStorage.removeItem('user');
          window.location.href = 'login/index.html';
        }
      };

      const BattleModule = {
        init() {
          document.getElementById('quick-match')?.addEventListener('click', () => {
            this.quickMatch();
          });

          document.querySelectorAll('.mode-card').forEach(card => {
            card.addEventListener('click', () => {
              const mode = card.dataset.mode;
              this.startMatch(mode);
            });
          });
        },

        quickMatch() {
          alert('⚡ 正在匹配对手...');
        },

        startMatch(mode) {
          const modeNames = {
            ranked: '天梯排位',
            casual: '休闲对战',
            campaign: '剧情战役',
            pve: '挑战首领'
          };
          alert(`🎮 正在进入 ${modeNames[mode] || mode}...`);
        }
      };

      const UIModule = {
        init() {
          document.querySelectorAll('.nav-tab').forEach(tab => {
            tab.addEventListener('click', () => {
              this.switchTab(tab.dataset.tab);
            });
          });

          document.getElementById('logout-btn')?.addEventListener('click', () => {
            AuthModule.logout();
          });
        },

        switchTab(tabName) {
          document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
          document.querySelector(`[data-tab="${tabName}"]`)?.classList.add('active');
          
          const panel = document.getElementById('main-panel');
          const titles = {
            battle: '⚔ 战斗大厅',
            deck: '🎴 卡组管理',
            collection: '📦 收藏馆',
            profile: '👤 档案信息'
          };
          panel.querySelector('.panel-title').textContent = titles[tabName] || '游戏';
        }
      };

      const GameApp = {
        async init() {
          const isAuth = await AuthModule.checkAuth();
          
          if (isAuth) {
            document.getElementById('login-required').classList.add('hidden');
            document.getElementById('game-content').classList.remove('hidden');
            
            BattleModule.init();
            UIModule.init();
            this.initBackground();
          }
        },

        initBackground() {
          const canvas = document.getElementById('starfield');
          const ctx = canvas.getContext('2d');
          let particles = [];

          function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            particles = Array.from({ length: Math.min(80, Math.floor(window.innerWidth / 20)) }, () => ({
              x: Math.random() * canvas.width,
              y: Math.random() * canvas.height,
              r: Math.random() * 1.2 + 0.3,
              vx: (Math.random() - 0.5) * 0.15,
              vy: (Math.random() - 0.5) * 0.15,
              alpha: Math.random() * 0.4 + 0.1
            }));
          }

          function drawParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p) => {
              p.x += p.vx;
              p.y += p.vy;
              if (p.x < -10) p.x = canvas.width + 10;
              if (p.x > canvas.width + 10) p.x = -10;
              if (p.y < -10) p.y = canvas.height + 10;
              if (p.y > canvas.height + 10) p.y = -10;
              ctx.beginPath();
              ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
              ctx.fillStyle = `rgba(255,255,255,${p.alpha})`;
              ctx.fill();
            });
            requestAnimationFrame(drawParticles);
          }

          window.addEventListener('resize', resizeCanvas);
          resizeCanvas();
          drawParticles();
        }
      };

      GameApp.init();
    </script>
  </body>
</html>
